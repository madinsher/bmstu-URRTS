# Склад домашнего задания УРРТС.
# Карта: '#' — стеллаж, '.' — проход. Клетка — cell метров; начало координат —
# центр левой верхней клетки, ось x — вправо по столбцам, ось y — вверх (строки вниз).
cell: 0.5
map: |
  ................
  .##.###..###.##.
  .##.###..###.##.
  ................
  ................
  .##.###..###.##.
  .##.###..###.##.
  ................
  ................
  ................

# Станции: [строка, столбец]
stations:
  P1: [3, 0]      # приёмка (pickup)
  P2: [4, 0]
  P3: [7, 0]
  D1: [3, 15]     # отгрузка (drop)
  D2: [4, 15]
  D3: [7, 15]
  H1: [9, 2]      # стоянки (home)
  H2: [9, 5]
  H3: [9, 10]
  H4: [9, 13]

robots:
  names: [r1, r2, r3, r4]
  homes: [H1, H2, H3, H4]
  speed: 0.3            # м/с
  handle_time: 3.0      # с на погрузку и на разгрузку
  radio_range: 4.0      # м
  radio_drop: 0.0       # вероятность потери пакета
  radio_latency: 0.05   # с

orders:
  rate: 0.05            # заказов в секунду (в среднем)
  reward: 10.0
  first_batch: 6        # заказов в момент старта
  stations_pickup: [P1, P2, P3]
  stations_drop: [D1, D2, D3]

traffic:
  settle: 0.3           # с между заявкой на клетку и въездом
  stale_after: 2.0      # с: состояние соседа устарело
  wait_limit: 6.0       # с ожидания клетки до попытки объезда
  lookahead: 2          # клеток впереди, которые робот может держать

cbba:
  capacity: 3           # заказов в пакете робота
  discount: 0.98        # λ в оценке R·λ^t
  period: 0.5           # с между итерациями «пакет — консенсус»
  stale_after: 3.0      # с: состояние соседа устарело
  commit_after: 2.0     # с стабильного выигрыша перед взятием заказа в работу
  lost_after: 6.0       # с тишины победителя, после которых его ставки сбрасываются
